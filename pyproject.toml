[project]
name = "recon-ml"
version = "0.1.0"
description = "Unsupervised-learning financial reconciliation inspired by machine translation (Chew, ICAIF'20)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
recon = "recon.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
